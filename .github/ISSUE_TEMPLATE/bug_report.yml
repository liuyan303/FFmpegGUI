name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please attach the log file
        from `%LOCALAPPDATA%\FFmpegGUI\logs\ffmpeg-gui.log` if possible.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version / source
      description: Status bar shows the detected version (or "auto-installed")
      placeholder: "7.1 (winget)"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: FFmpeg command (if a conversion failed)
      description: Copy it from the "FFmpeg command" panel together with the log output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: Drag & drop `ffmpeg-gui.log` here.
    validations:
      required: false
